name: Update KMD outlook

on:
  push:
    paths:
      - "kmd/7day.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install numpy matplotlib
      - name: Convert the KMD file
        run: python scripts/build_kmd.py
      - name: Save it to the website
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add kmd-data.js
          git diff --cached --quiet || git commit -m "KMD outlook update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
